# Configuracion de la base de datos MySQL
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/clientesjspdemo?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root

# Configuracion de JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Configuracion de las vistas JSP
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp

# Establece el puerto de la aplicación
server.port=8080

# Internacionalización
spring.messages.basename=messages
spring.messages.encoding=UTF-8
